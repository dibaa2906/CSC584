<!doctype html>
<html>
  <head>
    <title>CampusConnect - Login</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h1>CampusConnect</h1>
    <h2>Login</h2>
    <p>SIGN IN TO YOUR ACCOUNT</p>

    <form onsubmit="return loginDemo(event);">
      <table border="0" cellspacing="4" cellpadding="5">
        <tr>
          <td colspan="3">
            <b>Select User Type:</b>
          </td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="role" value="student" checked />
            Student
          </td>
          <td>
            <input type="radio" name="role" value="organizer" />
            Organizer
          </td>
        </tr>
        <tr>
          <td>Email or Student ID:</td>
          <td colspan="2">
            <input
              type="text"
              name="loginId"
              placeholder="Enter email or student ID"
              required
            />
          </td>
        </tr>
        <tr>
          <td>Password:</td>
          <td colspan="2">
            <input
              type="password"
              name="password"
              placeholder="Enter password"
              required
            />
          </td>
        </tr>
        <tr>
          <td></td>
          <td colspan="2">
            <input type="submit" value="Login" />
          </td>
        </tr>
      </table>
    </form>

    <p>
      Don't have an account?
      <a href="register.html">Register here</a>
    </p>

    <script>
      function loginDemo(event) {
        event.preventDefault();

        var role = document.querySelector('input[name="role"]:checked').value;

        if (role == "student") {
          window.location.href = "student/student-dashboard.html";
        } else if (role == "organizer") {
          window.location.href = "organizer/organizer-dashboard.html";
        } else {
          window.location.href = "admin/admin-dashboard.html";
        }

        return false;
      }
    </script>
  </body>
</html>
