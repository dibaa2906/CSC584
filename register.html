<!doctype html>
<html>
  <head>
    <title>CampusConnect - Create Account</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h1>CampusConnect</h1>
    <h2>Create Account</h2>

    <p>REGISTER AS A STUDENT TO DISCOVER CAMPUS EVENTS</p>

    <form onsubmit="return registerDemo(event);">
      <table border="0" cellspacing="4" cellpadding="5">
        <tr>
          <td>Full Name:</td>
          <td>
            <input type="text" name="fullName" required />
          </td>
        </tr>
        <tr>
          <td>Student ID:</td>
          <td>
            <input type="text" name="studentId" required />
          </td>
        </tr>
        <tr>
          <td>Email Address:</td>
          <td>
            <input type="email" name="email" required />
          </td>
        </tr>

        <tr>
          <td>Faculty:</td>
          <td><input type="text" name="faculty" required /></td>
        </tr>
        <tr>
          <td>Course:</td>
          <td><input type="text" name="course" required /></td>
        </tr>

        <tr>
          <td>Password:</td>
          <td>
            <input type="password" id="password" name="password" required />
          </td>
        </tr>
        <tr>
          <td>Confirm Password:</td>
          <td>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <input type="submit" value="Register" />
            <input type="reset" value="Clear" />
          </td>
        </tr>
      </table>
    </form>

    <p>
      Already have an account?
      <a href="index.html">Login here</a>
    </p>

    <script>
      function registerDemo(event) {
        event.preventDefault();

        var password = document.getElementById("password").value;

        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password != confirmPassword) {
          alert("Passwords do not match. Please try again.");
          return false;
        }

        alert("Registration successful! (Storyboard demo only)");

        window.location.href = "index.html";

        return false;
      }
    </script>
  </body>
</html>
