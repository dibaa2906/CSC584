<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Event - CampusConnect</title>
</head>
<body>

    <header>
        <h2>CampusConnect</h2>
        <nav>
            <a href="organizer-dashboard.html">Dashboard</a> |
            <a href="manage-events.html">Manage Events</a> |
            <a href="attendance.html">Participants</a> |
            <a href="../index.html">Logout</a>
        </nav>
        <hr>
    </header>

    <main>
        <h1>Create New Event</h1>
        <p>Note: All events are free admission. No payment details required.</p>

        <form action="manage-events.html" method="get" onsubmit="alert('Event has been created successfully (Demo only).');">
            <p>
                <label for="title">Event Title*:</label><br>
                <input type="text" id="title" name="title" required>
            </p>

            <p>
                <label for="description">Event Description*:</label><br>
                <textarea id="description" name="description" rows="4" cols="40" required></textarea>
            </p>

            <p>
                <label for="category">Category*:</label><br>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option value="Seminar">Seminar</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Sports">Sports</option>
                    <option value="Cultural">Cultural</option>
                </select>
            </p>

            <p>
                <label for="date">Date*:</label><br>
                <input type="date" id="date" name="date" required>
            </p>

            <p>
                <label for="time">Time*:</label><br>
                <input type="time" id="time" name="time" required>
            </p>

            <p>
                <label for="location">Location*:</label><br>
                <input type="text" id="location" name="location" required>
            </p>

            <p>
                <label for="capacity">Participant Capacity*:</label><br>
                <input type="number" id="capacity" name="capacity" min="1" required>
            </p>

            <p>
                <label for="deadline">Registration Deadline*:</label><br>
                <input type="date" id="deadline" name="deadline" required>
            </p>

            <p>
                <button type="submit">Create Event</button>
                <a href="manage-events.html"><button type="button">Cancel</button></a>
            </p>
        </form>
    </main>

</body>
</html>
