<!doctype html>
<html>
  <head>
    <title>CampusConnect - Register</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h1>CREATE ACCOUNT</h1>
    <p>REGISTER AS A STUDENT TO START DISCOVERING CAMPUS EVENTS</p>

    <form>
      <table border="0" cellspacing="4" cellpadding="5">
        <tr>
          <td>Full Name:</td>
          <td><input type="text" name="fullName" required /></td>
        </tr>
        <tr>
          <td>Student ID:</td>
          <td><input type="text" name="studentId" required /></td>
        </tr>
        <tr>
          <td>Email Address:</td>
          <td><input type="email" name="email" required /></td>
        </tr>
        <tr>
          <td>Faculty:</td>
          <td><input type="text" name="faculty" required /></td>
        </tr>
        <tr>
          <td>Course:</td>
          <td><input type="text" name="course" required /></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><input type="password" name="password" required /></td>
        </tr>
        <tr>
          <td>Confirm Password:</td>
          <td><input type="password" name="confirmPassword" required /></td>
        </tr>
        <tr>
          <td></td>
          <td><input type="button" value="Register" /></td>
        </tr>
      </table>
    </form>

    <p>
      Already have an account?
      <a href="index.html">Login here</a>
    </p>
  </body>
</html>
